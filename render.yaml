services:
  - type: web
    name: ai-music-studio-v2-lite
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: MAX_UPLOAD_MB
        value: 120
      - key: CORS_ORIGINS
        value: https://gogototo24-lang.github.io
