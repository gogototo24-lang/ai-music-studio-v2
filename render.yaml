services:
  - type: web
    name: ai-music-studio-v2-lite
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: MAX_UPLOAD_MB
        value: 120
      - key: CORS_ORIGINS
        value: https://gogototo24-lang.github.io

      - key: VOICE_PRIMARY_PROVIDER
        value: edge
      - key: COSYVOICE_API_URL
        value: ""
      - key: PILOTTTS_API_URL
        value: ""
      - key: GPT_SOVITS_API_URL
        value: ""

      - key: MUSIC_PRIMARY_PROVIDER
        value: musicgen
      - key: YUE2_API_URL
        value: ""
      - key: ACESTEP_API_URL
        value: ""

      - key: MUSIC_SERVICE_TOKEN
        sync: false
