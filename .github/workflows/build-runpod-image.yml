name: Build RunPod YuE2 Image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "handler.py"
      - "providers/runpod_yue2_handler.py"
      - "requirements-runpod-yue2.txt"
      - "deploy/runpod/Dockerfile"
      - ".github/workflows/build-runpod-image.yml"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/gogototo24-lang/ai-music-studio-v2-runpod-yue2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/runpod/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
