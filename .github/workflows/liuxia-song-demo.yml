name: Liuxia Song Demo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/liuxia-song-demo.yml'

jobs:
  build-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download successful Liuxia voice
        run: |
          curl -fsS --retry 5 --retry-delay 5 --max-time 120 -o voice.flac https://ai-music-studio-v2.onrender.com/outputs/voice_2c8f21eecc.flac
          test -s voice.flac
          ls -lh voice.flac

      - name: Generate BGM on Render
        run: |
          for i in $(seq 1 30); do
            CODE=$(curl -sS --max-time 120 -o music_response.json -w "%{http_code}" -X POST https://ai-music-studio-v2.onrender.com/api/music/generate -H 'Content-Type: application/json' --data '{"provider":"musicgen","title":"琉霞一念 Demo","style":"tragic_ballad","prompt":"cinematic oriental wuxia ambient bed","lyrics":"","duration":100,"use_fallback":true}')
            echo "MUSIC_HTTP=$CODE"
            cat music_response.json || true
            if [ "$CODE" = "200" ]; then exit 0; fi
            sleep 10
          done
          exit 1

      - name: Download BGM
        run: |
          python - <<'PY'
          import json, urllib.request, pathlib
          d=json.load(open('music_response.json', encoding='utf-8'))
          u=d['audio_url']
          if u.startswith('/'):
              u='https://ai-music-studio-v2.onrender.com'+u
          urllib.request.urlretrieve(u,'bgm.wav')
          print('BGM_BYTES='+str(pathlib.Path('bgm.wav').stat().st_size))
          PY

      - name: Mix Liuxia demo
        run: |
          CODE=$(curl -sS --max-time 180 -o mix_response.json -w "%{http_code}" -X POST https://ai-music-studio-v2.onrender.com/api/mix -F "voice_file=@voice.flac" -F "bgm_file=@bgm.wav" -F "voice_delay_ms=300" -F "bgm_volume=0.28" -F "ducking=true")
          echo "MIX_HTTP=$CODE"
          cat mix_response.json
          test "$CODE" = "200"

      - name: Print final URL
        run: |
          python - <<'PY'
          import json
          d=json.load(open('mix_response.json', encoding='utf-8'))
          u=d['audio_url']
          if u.startswith('/'):
              u='https://ai-music-studio-v2.onrender.com'+u
          print('FINAL_AUDIO_URL='+u)
          PY
