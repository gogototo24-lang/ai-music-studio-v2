name: Liuxia Song Demo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/liuxia-song-demo.yml'

jobs:
  build-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Download successful Liuxia voice
        run: |
          curl -fsS --retry 5 --retry-delay 5 --max-time 120             -o voice.flac             https://ai-music-studio-v2.onrender.com/outputs/voice_2c8f21eecc.flac
          test -s voice.flac
          ls -lh voice.flac

      - name: Generate local wuxia BGM
        run: |
          ffmpeg -y             -f lavfi -i "sine=frequency=110:duration=100:sample_rate=44100"             -f lavfi -i "sine=frequency=164.81:duration=100:sample_rate=44100"             -f lavfi -i "sine=frequency=220:duration=100:sample_rate=44100"             -f lavfi -i "anoisesrc=color=pink:duration=100:sample_rate=44100"             -filter_complex "[0:a]volume=0.08[a0];[1:a]volume=0.045[a1];[2:a]volume=0.025[a2];[3:a]lowpass=f=900,volume=0.012[a3];[a0][a1][a2][a3]amix=inputs=4:duration=longest,afade=t=in:st=0:d=2,afade=t=out:st=97:d=3"             -c:a pcm_s16le bgm.wav
          test -s bgm.wav
          ls -lh bgm.wav

      - name: Mix Liuxia demo
        run: |
          CODE=$(curl -sS --max-time 180 -o mix_response.json -w "%{http_code}"             -X POST https://ai-music-studio-v2.onrender.com/api/mix             -F "voice_file=@voice.flac"             -F "bgm_file=@bgm.wav"             -F "voice_delay_ms=300"             -F "bgm_volume=0.28"             -F "ducking=true")
          echo "MIX_HTTP=$CODE"
          cat mix_response.json
          test "$CODE" = "200"

      - name: Print final URL
        run: |
          python - <<'PY'
          import json
          d=json.load(open('mix_response.json', encoding='utf-8'))
          u=d['audio_url']
          if u.startswith('/'): u='https://ai-music-studio-v2.onrender.com'+u
          print('FINAL_AUDIO_URL='+u)
          PY
