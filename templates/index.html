<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Music Studio v2</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0a0d13;color:#fff;font-family:system-ui,"Noto Sans TC",sans-serif}main{max-width:900px;margin:auto;padding:18px 14px 60px}h1{font-size:38px;margin:10px 0 8px}p{line-height:1.6;color:#dbe3f0}.card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:18px;margin:18px 0;box-shadow:0 8px 24px rgba(0,0,0,.22)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.status{background:rgba(255,255,255,.03);padding:12px;border-radius:10px;white-space:pre-wrap;word-break:break-word}.status.ok{border:1px solid rgba(92,255,162,.5)}.primary,.alt{padding:10px 16px;border-radius:10px;border:none;cursor:pointer;font-weight:700;margin-top:10px} .primary{background:#6ea8fe;color:#07111d}.alt{background:#2d3748;color:#fff}input,textarea,select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:#0f1726;color:#fff;margin:8px 0 12px}textarea{min-height:120px}label{display:block;font-weight:600;margin-top:6px}audio,video{max-width:100%;border-radius:12px;margin-top:10px}a{color:#8ad1ff}.error{color:#ff9a9a}.success{color:#9ef0b9}.pill{display:inline-block;padding:5px 10px;border-radius:999px;background:rgba(110,168,254,.15);color:#b6d5ff} @media (max-width:720px){h1{font-size:28px}}
</style>
</head>
<body>
<main>
<small>AI MUSIC STUDIO · v2.0.1</small>
<h1>貓掌影音音樂工作室</h1>
<p>原創角色歌詞、女性口白、本機 BGM、音軌分離、Ducking 混音與直式 MV。</p>

<section class="card">
<h2>① 原創角色歌詞</h2>
<div class="grid">
<div><label>角色</label><input id="char" value="月扇影喵"></div>
<div><label>模式</label><select id="mode"><option value="battle">爆款武戲</option><option value="intro">角色登場</option><option value="ballad">抒情</option><option value="final">最終戰</option></select></div>
<div><label>語言</label><select id="lang"><option value="zh-TW">國語</option><option value="taiwanese">台語</option><option value="mixed">國語＋台語</option></select></div>
<div><label>副歌</label><select id="hook"><option value="normal">標準</option><option value="strong" selected>強烈</option><option value="max">超強</option></select></div>
</div>
<button class="primary" onclick="lyrics()">生成歌詞</button>
<label>歌名</label><input id="title">
<label>歌詞</label><textarea id="lyrics"></textarea>
</section>

<section class="card">
<h2>② 女性角色口白</h2>
<label>口白文字</label><textarea id="voiceText" placeholder="把登場口白貼在這裡"></textarea>
<label>聲線</label><select id="voicePreset"><option value="heroine">冷豔女俠</option><option value="overlord">霸氣女王</option><option value="gentle">溫柔女聲</option><option value="youth">青春女聲</option></select>
<button class="primary" onclick="voice()">生成口白</button>
<div id="voiceOut"></div>
</section>

<section class="card">
<h2>③ 本機武俠 BGM</h2>
<div class="grid">
<div><label>曲風</label><select id="style"><option value="wuxia_epic">武戲戰曲</option><option value="wuxia_zen">竹林文戲</option><option value="taiwanese_rock">台語搖滾</option><option value="tragic_ballad">悲情宿命</option><option value="dark_warlord">魔王降世</option></select></div>
<div><label>秒數</label><input id="musicDur" type="number" min="5" max="180" value="20"></div>
</div>
<label>自訂 Prompt（可空白）</label><input id="musicPrompt">
<button class="primary" onclick="music()">生成 BGM</button>
<div id="musicOut"></div>
</section>

<section class="card">
<h2>④ 音軌分離</h2>
<label>影片／音訊</label><input id="extractFile" type="file" accept="audio/*,video/*">
<button class="primary" onclick="extract()">分離人聲與伴奏</button>
<div id="extractOut"></div>
</section>

<section class="card">
<h2>⑤ Ducking 混音</h2>
<label>口白音檔</label><input id="mixVoice" type="file" accept="audio/*">
<label>BGM 音檔</label><input id="mixBgm" type="file" accept="audio/*">
<button class="primary" onclick="mix()">自動混音</button>
<div id="mixOut"></div>
</section>

<section class="card">
<h2>⑥ 自動 MV</h2>
<p>上傳角色圖／影片片段＋完成音訊，輸出 9:16 或 16:9 MP4。這裡是自動剪輯器，不會憑空生成角色動畫。超過 15 秒會在背景編碼，避免 HTTP 502。</p>
<div class="grid">
<div><label>比例</label><select id="aspect"><option value="9:16">9:16 Shorts/Reels</option><option value="16:9">16:9 YouTube</option></select></div>
<div><label>秒數</label><input id="mvDur" type="number" min="5" max="60" value="30"></div>
</div>
<label>完成音訊</label><input id="mvAudio" type="file" accept="audio/*">
<label>角色圖片／影片（可多選）</label><input id="mvMedia" type="file" accept="image/*,video/*" multiple>
<button class="primary" onclick="mv()">輸出 MV</button>
<div id="mvOut"></div>
</section>

<section class="card">
<h2>系統狀態</h2>
<div class="pill">API Base: <span id="apiBaseLabel">auto</span></div>
<button class="alt" onclick="health()">檢查後端</button>
<div id="status" class="status">尚未檢查。</div>
</section>
</main>

<script>
const $ = id => document.getElementById(id);
const DEFAULT_API_BASE = (window.__API_BASE__ || "").replace(/\/$/, "");
const API_BASE = DEFAULT_API_BASE;
const apiPath = (p) => (p.startsWith("http") ? p : `${API_BASE}${p}`);
const audio = url => `<audio controls src="${url}"></audio><p><a href="${url}" target="_blank">開啟檔案</a></p>`;

if (API_BASE) {
  $("apiBaseLabel").textContent = API_BASE;
} else {
  $("apiBaseLabel").textContent = "same-origin / default";
}

async function jfetch(url, opt = {}) {
  const target = apiPath(url);
  const r = await fetch(target, opt);
  let j = {};
  try { j = await r.json(); } catch {}
  if (!r.ok) throw Error(j.detail || j.error || ("HTTP " + r.status));
  return j;
}

async function health(){
  try {
    const j = await jfetch("/health");
    $("status").textContent = JSON.stringify(j, null, 2);
    $("status").className = "status ok";
  } catch (e) {
    $("status").textContent = e.message;
    $("status").className = "status error";
  }
}

async function lyrics(){
  try {
    const j = await jfetch("/api/lyrics/generate", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        character_name: $("char").value,
        mode: $("mode").value,
        language: $("lang").value,
        hook_strength: $("hook").value,
      })
    });
    $("title").value = j.title || "";
    $("lyrics").value = j.lyrics || "";
    $("status").textContent = JSON.stringify(j, null, 2);
    $("status").className = "status ok";
  } catch (e) {
    $("status").textContent = e.message;
    $("status").className = "status error";
  }
}

async function voice(){
  try {
    const j = await jfetch("/api/voice/generate", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        text: $("voiceText").value,
        preset: $("voicePreset").value,
        enable_reverb: true,
      })
    });
    $("voiceOut").innerHTML = audio(j.audio_url);
    $("status").textContent = JSON.stringify(j, null, 2);
    $("status").className = "status ok";
  } catch (e) {
    $("status").textContent = e.message;
    $("status").className = "status error";
  }
}

async function music(){
  try {
    const j = await jfetch("/api/music/generate", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        style: $("style").value,
        prompt: $("musicPrompt").value,
        duration: Number($("musicDur").value || 20),
      })
    });
    $("musicOut").innerHTML = `
      <p><strong>引擎：</strong>${j.engine}</p>
      <p><strong>備註：</strong>${j.note || ""}</p>
      ${audio(j.audio_url)}
    `;
    $("status").textContent = JSON.stringify(j, null, 2);
    $("status").className = "status ok";
  } catch (e) {
    $("status").textContent = e.message;
    $("status").className = "status error";
  }
}

async function extract(){
  const f = $("extractFile").files[0];
  if (!f) return alert("請選檔案");
  const fd = new FormData();
  fd.append("file", f);
  try {
    const j = await jfetch("/api/extract", { method: "POST", body: fd });
    $("extractOut").innerHTML = `
      <p><strong>引擎：</strong>${j.engine}</p>
      <div>${audio(j.vocal_url)}</div>
      <div>${audio(j.bgm_url)}</div>
    `;
    $("status").textContent = JSON.stringify(j, null, 2);
    $("status").className = "status ok";
  } catch (e) {
    $("status").textContent = e.message;
    $("status").className = "status error";
  }
}

async function mix(){
  const v = $("mixVoice").files[0], b = $("mixBgm").files[0];
  if (!v || !b) return alert("請選口白與 BGM");
  const fd = new FormData();
  fd.append("voice_file", v);
  fd.append("bgm_file", b);
  try {
    const j = await jfetch("/api/mix", { method: "POST", body: fd });
    $("mixOut").innerHTML = audio(j.audio_url);
    $("status").textContent = JSON.stringify(j, null, 2);
    $("status").className = "status ok";
  } catch (e) {
    $("status").textContent = e.message;
    $("status").className = "status error";
  }
}

async function mv(){
  const a = $("mvAudio").files[0], m = [...$("mvMedia").files];
  if (!a || !m.length) return alert("請選完成音訊和至少一個畫面素材");
  const fd = new FormData();
  fd.append("title", $("title").value || "AI Music Studio MV");
  fd.append("lyrics", $("lyrics").value);
  fd.append("aspect", $("aspect").value);
  fd.append("duration", $("mvDur").value);
  fd.append("audio_file", a);
  m.forEach(x => fd.append("media_files", x));
  try {
    $("mvOut").innerHTML = '<div class="status">已送出，背景渲染中…請不要關閉頁面</div>';
    const j = await jfetch("/api/mv/render", { method: "POST", body: fd });
    if (j.video_url) {
      $("mvOut").innerHTML = `<video controls src="${j.video_url}"></video><p><a href="${j.video_url}" target="_blank">開啟 MP4</a></p>`;
      return;
    }
    const jobId = j.job_id;
    for (let i = 0; i < 90; i++) {
      await new Promise(r => setTimeout(r, 2000));
      const s = await jfetch(`/api/mv/status/${jobId}`);
      $("mvOut").innerHTML = `<div class="status">狀態：${s.status}（${i * 2} 秒）</div>`;
      if (s.status === "success") {
        $("mvOut").innerHTML = `<video controls src="${s.video_url}"></video><p><a href="${s.video_url}" target="_blank">開啟 MP4</a></p>`;
        return;
      }
      if (s.status === "error") throw Error(s.detail || "渲染失敗");
    }
    throw Error("等待逾時，請再試一次或把秒數降到 30");
  } catch (e) {
    $("status").textContent = e.message;
    $("status").className = "status error";
    $("mvOut").innerHTML = `<div class="status error">${e.message}</div>`;
  }
}

health();
</script>
</body>
</html>
